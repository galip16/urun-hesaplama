<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ürün Hesaplama</title>
    <style>
        html {
            height: 100%;
        }

        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: auto;
            padding: 1rem;

            min-height: 100dvh;
            box-sizing: border-box;

            overflow-y: auto;
        }


        h1 {
            text-align: center;
        }

        .products {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .product {
            border: 1px solid #9a7474;
            border-radius: 8px;
            padding: 0.5rem;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .product img {
            max-width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
        }

        .total {
            margin-top: 1rem;
            border: 2px solid #333;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;

            >p {
                margin: 2px;
            }
        }

        .summary {
            margin-top: 1rem;
        }

        .item-line {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
        }

        button.remove {
            margin-left: 5px;
            color: red;
            cursor: pointer;
            width: 6rem;
        }

        .itemInfo {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="products" id="productList"></div>

    <div class="total">
        <p> Ürün Adeti: <span id="totalItems">0</span></p>
        <p><strong> Ücret: <span id="totalPrice">0</span> TL</strong></p>
    </div>

    <div class="summary" id="summary"></div>

    <script>
        const products = [
            { id: 1, name: "Beze", price: 70, image: "Beze.jpeg" },
            { id: 2, name: "Gofret", price: 50, image: "Gofret.jpeg" },
            { id: 3, name: "Kagit Helva", price: 35, image: "KagitHelva.jpeg" },
            { id: 4, name: "Kütahya Bitli Helva", price: 200, image: "BitliHelva.jpeg" },
            { id: 5, name: "Koz", price: 35, image: "Koz.jpeg" },
            { id: 6, name: "Susamli Helva", price: 100, image: "SusamHelva.jpeg" },
            { id: 7, name: "Krokan", price: 70, image: "SusamliKrokan.jpeg" },
            { id: 8, name: "Köpük", price: 100, image: "Köpük.jpeg" },
        ];

        const productList = document.getElementById("productList");
        const totalItemsEl = document.getElementById("totalItems");
        const totalPriceEl = document.getElementById("totalPrice");
        const summaryEl = document.getElementById("summary");

        let cart = {};

        function renderSummary() {
            summaryEl.innerHTML = "";

            Object.keys(cart).forEach(id => {
                const item = cart[id];

                if (item.count > 0) {
                    const line = document.createElement("div");
                    line.className = "item-line";

                    let discountText = "";

                    // 35 TL'lik ürünler için indirim hesapla
                    if (item.price === 35) {
                        const normalPrice = item.count * 35;

                        const paket6 = Math.floor(item.count / 6);
                        const kalan = item.count % 6;

                        let campaignPrice = paket6 * 200;

                        if (kalan >= 3) {
                            campaignPrice += 100;
                            campaignPrice += (kalan - 3) * 35;
                        } else {
                            campaignPrice += kalan * 35;
                        }

                        const discount = normalPrice - campaignPrice;

                        if (discount > 0) {
                            discountText = ` (${discount} TL indirim)`;
                        }
                    }

                    line.innerHTML = `
                <span>${item.name} x ${item.count}${discountText}</span>
                <span>
                    <button onclick="removeOne(${id})" class="remove">iptal</button>
                </span>
            `;

                    summaryEl.appendChild(line);
                }
            });
        }


        function updateTotals() {
            let totalItems = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalItems += item.count;

                if (item.price === 35) {
                    const paket6 = Math.floor(item.count / 6);
                    const kalan = item.count % 6;

                    let itemTotal = paket6 * 200;

                    if (kalan >= 3) {
                        itemTotal += 100;
                        itemTotal += (kalan - 3) * 35;
                    } else {
                        itemTotal += kalan * 35;
                    }

                    totalPrice += itemTotal;
                } else {
                    totalPrice += item.count * item.price;
                }
            });

            totalItemsEl.textContent = totalItems;
            totalPriceEl.textContent = totalPrice;

            renderSummary();
        }


        function addToCart(p) {
            if (!cart[p.id]) {
                cart[p.id] = { ...p, count: 0 };
            }
            cart[p.id].count++;
            updateTotals();
        }

        window.removeOne = function (id) {
            if (cart[id] && cart[id].count > 0) {
                cart[id].count--;
                updateTotals();
            }
        };

        products.forEach(p => {
            const btn = document.createElement("div");
            btn.className = "product";
            btn.innerHTML = `
        <img src="${p.image}" alt="${p.name}">
        <div class="itemInfo" >${p.name}</div>
        <div>${p.price} TL</div>
      `;
            btn.addEventListener("click", () => addToCart(p));
            productList.appendChild(btn);
        });

        // Hata olursa cart sıfırlansın
        window.addEventListener("error", () => {
            cart = {};
            updateTotals();
        });
    </script>
</body>

</html>
